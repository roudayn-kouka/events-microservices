# Tests : ni Config Server ni Eureka ; base H2 en mémoire (comme les tests du monolithe)
spring:
  application:
    name: participant-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:participant;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
eureka:
  client:
    enabled: false
logging:
  level:
    root: warn
