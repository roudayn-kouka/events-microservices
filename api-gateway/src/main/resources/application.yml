# Seul le nom et l'adresse du Config Server sont locaux ; routes et CORS : config-repo/api-gateway.yml
spring:
  application:
    name: api-gateway
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      # Config Server indisponible (démarrage, redémarrage) : nouvelles tentatives, puis échec net
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20
