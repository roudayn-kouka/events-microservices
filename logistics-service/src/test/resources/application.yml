# Tests : ni Config Server ni Eureka ; base H2 en mémoire (comme les tests du monolithe)
spring:
  application:
    name: logistics-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:logistics;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
# Axon sans Axon Server : bus local et event store JPA sur H2 ; même sérialiseur qu'en production
axon:
  axonserver:
    enabled: false
  serializer:
    general: jackson
    events: jackson
    messages: jackson
eureka:
  client:
    enabled: false
logging:
  level:
    root: warn
