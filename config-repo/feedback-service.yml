# feedback-service : base dédiée db_feedback, utilisateur feedback_user ; vérifie l'événement
# (event-service) et le participant (participant-service) par OpenFeign
server:
  port: ${SERVER_PORT:8104}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/db_feedback
    username: feedback_user
    password: ${FEEDBACK_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

feedback:
  # règle « événement terminé » : dateFin < aujourd'hui, dans ce fuseau
  fuseau-horaire: Africa/Tunis
