# event-service : base dédiée db_event, utilisateur event_user ; appelle participant-service
# et logistics-service par OpenFeign (lb:// via Eureka)
server:
  port: ${SERVER_PORT:8101}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/db_event
    username: event_user
    password: ${EVENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

events:
  cout:
    # calculCout : toutes les 60 s comme dans le monolithe (cron Spring : s m h j M jS)
    cron: "0 * * * * *"

# CQRS (phase 3) : la projection locale (table event = modèle de lecture) est traitée dans
# l'unité de travail de la commande : à jour quand CommandGateway.sendAndWait rend la main.
axon:
  eventhandling:
    processors:
      event-lecture:
        mode: subscribing
