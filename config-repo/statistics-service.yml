# statistics-service (mon module) — CÔTÉ REQUÊTES CQRS (phase 3)
# Base dédiée db_stats (stats_user) : projections des événements Axon + token store (token_entry).
server:
  port: ${SERVER_PORT:8105}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/db_stats
    username: stats_user
    password: ${STATS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      # les requêtes Axon sans paramètre (records vides) sont sérialisées en {}
      fail-on-empty-beans: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

stats:
  # projections : lecture de db_stats (APRÈS CQRS, par défaut)
  # feign       : lecture des 4 services à chaque requête (AVANT CQRS, pour la comparaison)
  source: projections

axon:
  eventhandling:
    processors:
      statistiques:
        # processeur à jetons : lit le flux d'Axon Server à son rythme, position dans token_entry
        mode: tracking
