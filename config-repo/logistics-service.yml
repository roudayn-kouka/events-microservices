# logistics-service : base dédiée db_logistics, utilisateur logistics_user
server:
  port: ${SERVER_PORT:8103}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/db_logistics
    username: logistics_user
    password: ${LOGISTICS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
