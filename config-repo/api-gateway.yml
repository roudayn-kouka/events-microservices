# =============================================================================
#  API Gateway : point d'entrée unique. /api/<ressource>/** -> lb://<service>
#  « lb:// » : l'adresse réelle est résolue dans Eureka et répartie par
#  Spring Cloud LoadBalancer entre les instances disponibles.
# =============================================================================
server:
  port: 8088

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # instance arrêtée : échec de connexion en 2 s (et non 14 s), puis Retry sur l'autre
            connect-timeout: 2000
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Instance-Id, traceparent]
                allow-credentials: true
                max-age: 3600
          default-filters:
            # Évite les en-têtes CORS en double si un service en ajoute aussi
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # Phase 7 : OpenAPI de participant-service pour le Swagger agrégé (/docs/participant-service/v3/api-docs → /v3/api-docs)
            - id: docs-participant-service
              uri: lb://participant-service
              predicates: [Path=/docs/participant-service/**]
              filters:
                - RewritePath=/docs/participant-service/(?<chemin>.*), /$\{chemin}
            # Phase 7 : OpenAPI de logistics-service pour le Swagger agrégé (/docs/logistics-service/v3/api-docs → /v3/api-docs)
            - id: docs-logistics-service
              uri: lb://logistics-service
              predicates: [Path=/docs/logistics-service/**]
              filters:
                - RewritePath=/docs/logistics-service/(?<chemin>.*), /$\{chemin}
            # Phase 7 : OpenAPI de event-service pour le Swagger agrégé (/docs/event-service/v3/api-docs → /v3/api-docs)
            - id: docs-event-service
              uri: lb://event-service
              predicates: [Path=/docs/event-service/**]
              filters:
                - RewritePath=/docs/event-service/(?<chemin>.*), /$\{chemin}
            # Phase 7 : OpenAPI de feedback-service pour le Swagger agrégé (/docs/feedback-service/v3/api-docs → /v3/api-docs)
            - id: docs-feedback-service
              uri: lb://feedback-service
              predicates: [Path=/docs/feedback-service/**]
              filters:
                - RewritePath=/docs/feedback-service/(?<chemin>.*), /$\{chemin}
            # Phase 7 : OpenAPI de statistics-service pour le Swagger agrégé (/docs/statistics-service/v3/api-docs → /v3/api-docs)
            - id: docs-statistics-service
              uri: lb://statistics-service
              predicates: [Path=/docs/statistics-service/**]
              filters:
                - RewritePath=/docs/statistics-service/(?<chemin>.*), /$\{chemin}
            - id: event-service
              uri: lb://event-service
              predicates: [Path=/api/events/**]
              filters:
                - StripPrefix=1
                # panne du service : 503 JSON explicite (au lieu d'un 500 de connexion refusée)
                - name: CircuitBreaker
                  args:
                    name: gw-event-service
                    fallbackUri: forward:/indisponible/event-service
                # Phase 5 : DANS le CircuitBreaker, pour rejouer avant que le fallback réponde.
                # Une instance arrêtée reste connue quelques secondes (registre Eureka relu toutes
                # les 5 s + cache du LoadBalancer 5 s) : une LECTURE en échec est rejouée sur
                # l'instance suivante, la bascule est invisible. Jamais un POST.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            - id: participant-service
              uri: lb://participant-service
              predicates: [Path=/api/participants/**]
              filters:
                - StripPrefix=1
                # panne du service : 503 JSON explicite (au lieu d'un 500 de connexion refusée)
                - name: CircuitBreaker
                  args:
                    name: gw-participant-service
                    fallbackUri: forward:/indisponible/participant-service
                # Phase 5 : DANS le CircuitBreaker, pour rejouer avant que le fallback réponde.
                # Une instance arrêtée reste connue quelques secondes (registre Eureka relu toutes
                # les 5 s + cache du LoadBalancer 5 s) : une LECTURE en échec est rejouée sur
                # l'instance suivante, la bascule est invisible. Jamais un POST.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            - id: logistics-service
              uri: lb://logistics-service
              predicates: [Path=/api/logistics/**]
              filters:
                - StripPrefix=1
                # panne du service : 503 JSON explicite (au lieu d'un 500 de connexion refusée)
                - name: CircuitBreaker
                  args:
                    name: gw-logistics-service
                    fallbackUri: forward:/indisponible/logistics-service
                # Phase 5 : DANS le CircuitBreaker, pour rejouer avant que le fallback réponde.
                # Une instance arrêtée reste connue quelques secondes (registre Eureka relu toutes
                # les 5 s + cache du LoadBalancer 5 s) : une LECTURE en échec est rejouée sur
                # l'instance suivante, la bascule est invisible. Jamais un POST.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            - id: feedback-service
              uri: lb://feedback-service
              predicates: [Path=/api/feedback/**]
              filters:
                - StripPrefix=1
                # panne du service : 503 JSON explicite (au lieu d'un 500 de connexion refusée)
                - name: CircuitBreaker
                  args:
                    name: gw-feedback-service
                    fallbackUri: forward:/indisponible/feedback-service
                # Phase 5 : DANS le CircuitBreaker, pour rejouer avant que le fallback réponde.
                # Une instance arrêtée reste connue quelques secondes (registre Eureka relu toutes
                # les 5 s + cache du LoadBalancer 5 s) : une LECTURE en échec est rejouée sur
                # l'instance suivante, la bascule est invisible. Jamais un POST.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            - id: statistics-service
              uri: lb://statistics-service
              predicates: [Path=/api/stats/**]
              filters:
                - StripPrefix=1
                # panne du service : 503 JSON explicite (au lieu d'un 500 de connexion refusée)
                - name: CircuitBreaker
                  args:
                    name: gw-statistics-service
                    fallbackUri: forward:/indisponible/statistics-service
                # Phase 5 : DANS le CircuitBreaker, pour rejouer avant que le fallback réponde.
                # Une instance arrêtée reste connue quelques secondes (registre Eureka relu toutes
                # les 5 s + cache du LoadBalancer 5 s) : une LECTURE en échec est rejouée sur
                # l'instance suivante, la bascule est invisible. Jamais un POST.
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException

# CircuitBreaker de la Gateway (phase 4) : un par route. Délai large (20 s) : les services ont leurs
# propres Retry (3 × 500 ms) et TimeLimiter (5 s) sur leurs appels Feign, qui doivent pouvoir aboutir.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 20s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh,gateway
  endpoint:
    gateway:
      # /actuator/gateway/routes : consultation des routes seulement (pas de modification à chaud)
      access: read-only

# Swagger agrégé (phase 7) : http://localhost:8088/swagger-ui.html, un sélecteur pour les 5 services.
# « Try it out » passe par la Gateway (serveur /api déclaré par chaque service, module common).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: statistics-service (mon module)
    urls:
      - name: participant-service
        url: /docs/participant-service/v3/api-docs
      - name: logistics-service
        url: /docs/logistics-service/v3/api-docs
      - name: event-service
        url: /docs/event-service/v3/api-docs
      - name: feedback-service
        url: /docs/feedback-service/v3/api-docs
      - name: statistics-service (mon module)
        url: /docs/statistics-service/v3/api-docs

